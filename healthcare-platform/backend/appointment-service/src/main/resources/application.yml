server:
  port: 8084

spring:
  application:
    name: appointment-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:healthcare_platform}?currentSchema=appointment_schema
    username: ${POSTGRES_USER:healthcare_admin}
    password: ${POSTGRES_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: appointment_schema

services:
  patient-url: ${PATIENT_SERVICE_URL:http://localhost:8082}
  doctor-url: ${DOCTOR_SERVICE_URL:http://localhost:8083}
  notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
