server:
  port: 8083

spring:
  application:
    name: doctor-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:healthcare_platform}?currentSchema=doctor_schema
    username: ${POSTGRES_USER:healthcare_admin}
    password: ${POSTGRES_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: doctor_schema

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
