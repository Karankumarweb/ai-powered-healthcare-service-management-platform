version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: careflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_platform}
      POSTGRES_USER: ${POSTGRES_USER:-healthcare_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/sample-data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healthcare_admin} -d ${POSTGRES_DB:-healthcare_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - careflow-net

  auth-service:
    build: ./backend/auth-service
    container_name: careflow-auth
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_platform}
      POSTGRES_USER: ${POSTGRES_USER:-healthcare_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - careflow-net

  patient-service:
    build: ./backend/patient-service
    container_name: careflow-patient
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_platform}
      POSTGRES_USER: ${POSTGRES_USER:-healthcare_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - careflow-net

  doctor-service:
    build: ./backend/doctor-service
    container_name: careflow-doctor
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_platform}
      POSTGRES_USER: ${POSTGRES_USER:-healthcare_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - careflow-net

  notification-service:
    build: ./backend/notification-service
    container_name: careflow-notification
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_platform}
      POSTGRES_USER: ${POSTGRES_USER:-healthcare_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - careflow-net

  appointment-service:
    build: ./backend/appointment-service
    container_name: careflow-appointment
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_platform}
      POSTGRES_USER: ${POSTGRES_USER:-healthcare_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PATIENT_SERVICE_URL: http://patient-service:8082
      DOCTOR_SERVICE_URL: http://doctor-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      patient-service:
        condition: service_started
      doctor-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - careflow-net

  ai-assistant-service:
    build: ./backend/ai-assistant-service
    container_name: careflow-ai
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - careflow-net

  api-gateway:
    build: ./backend/api-gateway
    container_name: careflow-gateway
    environment:
      API_GATEWAY_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      PATIENT_SERVICE_URL: http://patient-service:8082
      DOCTOR_SERVICE_URL: http://doctor-service:8083
      APPOINTMENT_SERVICE_URL: http://appointment-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      AI_ASSISTANT_SERVICE_URL: http://ai-assistant-service:8086
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - patient-service
      - doctor-service
      - appointment-service
      - notification-service
      - ai-assistant-service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - careflow-net

  healthcare-ui:
    build:
      context: ./frontend/healthcare-ui
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    container_name: careflow-ui
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - careflow-net

volumes:
  pgdata:

networks:
  careflow-net:
    driver: bridge
